<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Smart Digital Village</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#d1fae5,#bbf7d0);
}

.container{
    width:430px;
    background:#fff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 15px 35px rgba(22,163,74,.15);
}

.logo{
    width:80px;
    height:80px;
    margin:auto;
    background:#dcfce7;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
}

h2{
    text-align:center;
    color:#166534;
    margin-top:18px;
}

p{
    text-align:center;
    color:#666;
    margin:10px 0 25px;
    font-size:14px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#166534;
    font-weight:600;
}

.password-box{
    position:relative;
}

.password-box input{
    width:100%;
    padding:14px;
    border:2px solid #bbf7d0;
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:.3s;
}

.password-box input:focus{
    border-color:#16a34a;
}

.toggle{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    user-select:none;
    font-size:18px;
}

#strength{
    margin-top:8px;
    font-size:13px;
    font-weight:600;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#16a34a;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#15803d;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#16a34a;
    text-decoration:none;
    font-weight:600;
}

.back:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
🔑
</div>

<h2>Create New Password</h2>

<p>Create a new password for your Smart Digital Village account.</p>

<div class="input-group">

<label>New Password</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Enter new password"
onkeyup="checkStrength()">

<span class="toggle" onclick="togglePassword('password',this)">👁</span>

</div>

<div id="strength"></div>

</div>

<div class="input-group">

<label>Confirm Password</label>

<div class="password-box">

<input
type="password"
id="confirmPassword"
placeholder="Confirm password">

<span class="toggle" onclick="togglePassword('confirmPassword',this)">👁</span>

</div>

</div>

<button onclick="updatePassword()">
Update Password
</button>

<a href="/login" class="back">
← Back to Login
</a>

</div>

<script>

function togglePassword(id,icon){

const input=document.getElementById(id);

if(input.type==="password"){

input.type="text";
icon.innerHTML="🙈";

}else{

input.type="password";
icon.innerHTML="👁";

}

}

function checkStrength(){

const password=document.getElementById("password").value;

const strength=document.getElementById("strength");

if(password.length<6){

strength.innerHTML="🔴 Weak Password";
strength.style.color="red";

}
else if(password.length<10){

strength.innerHTML="🟡 Medium Password";
strength.style.color="orange";

}
else{

strength.innerHTML="🟢 Strong Password";
strength.style.color="green";

}

}

async function updatePassword(){

const password=document.getElementById("password").value;
const confirm=document.getElementById("confirmPassword").value;

if(password==="" || confirm===""){

alert("Please fill all fields.");

return;

}

if(password!==confirm){

alert("Passwords do not match.");

return;

}

try{

const response=await fetch("/update-password",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
password:password
})

});

const data=await response.json();

if(data.success){

alert("Password updated successfully!");

window.location.href="/login";

}else{

alert(data.message);

}

}
catch{

alert("Server error.");

}

}

</script>

</body>
</html>
