<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Smart Digital Village</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/citizen.css') }}">
</head>

<body class="page-forgot-password">

<div class="container">

    <div class="logo">
        🔒
    </div>

    <h2>Forgot Password</h2>

    <p class="subtitle">
        Enter your registered username or phone number to reset your password.
    </p>

    <div class="input-group">
        <label>Username or Phone Number</label>

        <input
            type="text"
            id="username"
            placeholder="Enter username or phone number"
            required>
    </div>

    <button id="otpBtn" onclick="sendOTP()">
        Continue
    </button>

    <div class="loader" id="loader"></div>

    <div class="message" id="message"></div>

    <a href="{{ url_for('citizen_login') }}" class="back">
        ← Back to Login
    </a>

</div>


<script src="{{ url_for('static', filename='js/citizen.js') }}"></script>
</body>
</html>
