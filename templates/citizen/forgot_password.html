
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Smart Digital Village</title>


    <link rel="stylesheet" href="{{ url_for('static', filename='css/citizen.css') }}">
</head>

<body class="page-forgot-password">

<div class="container">

<div class="logo">
🔒
</div>

<h2>Forgot Password</h2>

<p class="subtitle">
Enter your registered email address to receive a One-Time Password (OTP).
</p>

<div class="input-group">
<label>Email Address</label>
<input
type="email"
id="email"
placeholder="Enter your registered email"
required>
</div>

<button id="otpBtn" onclick="sendOTP()">
Get OTP
</button>

<div class="loader" id="loader"></div>

<div class="message" id="message"></div>

<a href="/login" class="back">
← Back to Login
</a>

</div>



    <script src="{{ url_for('static', filename='js/citizen.js') }}"></script>
</body>
</html>
