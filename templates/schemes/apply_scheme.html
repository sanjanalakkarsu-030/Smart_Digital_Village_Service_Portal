<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Government Scheme</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/schemes.css') }}">
</head>

<body>

<header>
    <h1>Apply for Government Scheme</h1>
</header>


<div class="container">

    <div class="card">

        <form>

            <!-- Full Name -->
            <label>Full Name</label>
            <input
                type="text"
                name="full_name"
                placeholder="Enter Full Name"
                required>


            <!-- Father's Name -->
            <label>Father's Name</label>
            <input
                type="text"
                name="father_name"
                placeholder="Enter Father's Name"
                required>


            <!-- Aadhaar Number -->
            <label>Aadhaar Number</label>
            <input
                type="text"
                name="aadhaar_number"
                placeholder="Enter Aadhaar Number"
                maxlength="12"
                required>


            <!-- Mobile Number -->
            <label>Mobile Number</label>
            <input
                type="tel"
                name="mobile"
                placeholder="Enter Mobile Number"
                maxlength="10"
                required>


            <!-- Email -->
            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter Email">


            <!-- Gender -->
            <label>Gender</label>
            <select name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>


            <!-- Scheme Name -->
            <label>Scheme Name</label>
            <input
                type="text"
                id="schemeName"
                name="scheme_name"
                readonly>


            <!-- Village -->
            <label>Village</label>
            <input
                type="text"
                name="village"
                placeholder="Village Name"
                required>


            <!-- Mandal -->
            <label>Mandal</label>
            <input
                type="text"
                name="mandal"
                placeholder="Mandal"
                required>


            <!-- District -->
            <label>District</label>
            <input
                type="text"
                name="district"
                placeholder="District"
                required>


            <!-- Aadhaar Document -->
            <label>Upload Aadhaar</label>
            <input
                type="file"
                name="aadhaar_document"
                accept=".pdf,.jpg,.jpeg,.png">


            <!-- Income Certificate -->
            <label>Upload Income Certificate</label>
            <input
                type="file"
                name="income_certificate"
                accept=".pdf,.jpg,.jpeg,.png">


            <!-- Submit -->
            <button type="submit">
                Submit Application
            </button>

        </form>

    </div>

</div>


<!-- Schemes JavaScript -->
<script src="{{ url_for('static', filename='js/schemes.js') }}"></script>


<!-- Get Selected Scheme -->
<script>

    const params = new URLSearchParams(window.location.search);

    const scheme = params.get("scheme");

    if (scheme) {

        document.getElementById("schemeName").value = scheme;

    }

</script>

</body>
</html>
