<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Smart Digital Village Service Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#d1fae5,#bbf7d0);
}

.container{
    width:420px;
    background:#fff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 15px 35px rgba(22,163,74,.15);
    animation:fadeIn .5s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.logo{
    width:85px;
    height:85px;
    margin:auto;
    border-radius:50%;
    background:#dcfce7;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
}

h2{
    text-align:center;
    color:#166534;
    margin-top:18px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin:10px 0 30px;
    font-size:14px;
    line-height:22px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#166534;
    font-weight:600;
}

.input-group input{
    width:100%;
    padding:14px;
    border:2px solid #bbf7d0;
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:.3s;
}

.input-group input:focus{
    border-color:#16a34a;
}

.password-box{
    position:relative;
}

.password-box input{
    width:100%;
    padding:14px;
    padding-right:40px;
    border:2px solid #bbf7d0;
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:.3s;
}

.password-box input:focus{
    border-color:#16a34a;
}

.toggle{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    user-select:none;
    font-size:18px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#16a34a;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#15803d;
}

button:disabled{
    background:#86efac;
    cursor:not-allowed;
}

.loader{
    display:none;
    width:22px;
    height:22px;
    margin:18px auto;
    border:3px solid #dcfce7;
    border-top:3px solid #16a34a;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.message{
    text-align:center;
    margin-top:15px;
    color:#15803d;
    font-weight:500;
    display:none;
}

.error-message{
    text-align:center;
    margin-top:15px;
    color:#dc2626;
    font-weight:500;
    display:none;
}

.links{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
    font-size:14px;
}

.links a{
    color:#16a34a;
    text-decoration:none;
    font-weight:600;
}

.links a:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
👤
</div>

<h2>Citizen Login</h2>

<p class="subtitle">
Login to access Smart Digital Village Services.
</p>

<div class="input-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter your username" required>
</div>

<div class="input-group">
    <label>Password</label>
    <div class="password-box">
        <input type="password" id="password" placeholder="Enter your password" required>
        <span class="toggle" onclick="togglePassword()">👁</span>
    </div>
</div>

<button id="loginBtn" onclick="login()">
Login
</button>

<div class="loader" id="loader"></div>

<div class="message" id="message"></div>
<div class="error-message" id="errorMessage"></div>

<div class="links">
    <a href="/forgot-password">Forgot Password?</a>
    <a href="/register">New Registration</a>
</div>

</div>

<script>

function togglePassword(){

const input=document.getElementById("password");
const icon=document.querySelector(".toggle");

if(input.type==="password"){

input.type="text";
icon.innerHTML="🙈";

}else{

input.type="password";
icon.innerHTML="👁";

}

}

async function login(){

const username=document.getElementById("username").value.trim();
const password=document.getElementById("password").value;

const message=document.getElementById("message");
const errorMessage=document.getElementById("errorMessage");

message.style.display="none";
errorMessage.style.display="none";

if(!username || !password){

errorMessage.innerHTML="Please enter username and password.";
errorMessage.style.display="block";
return;

}

document.getElementById("loader").style.display="block";
document.getElementById("loginBtn").disabled=true;

try{

const response=await fetch("/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
username:username,
password:password
})

});

const data=await response.json();

document.getElementById("loader").style.display="none";
document.getElementById("loginBtn").disabled=false;

if(data.success){

message.innerHTML="Login successful! Redirecting...";
message.style.display="block";

setTimeout(function(){

window.location.href="/";

},1000);

}
else{

errorMessage.innerHTML=data.message;
errorMessage.style.display="block";

}

}
catch(error){

document.getElementById("loader").style.display="none";
document.getElementById("loginBtn").disabled=false;

errorMessage.innerHTML="Unable to connect to the server.";
errorMessage.style.display="block";

}

}

</script>

</body>
</html>
