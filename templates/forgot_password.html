
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Smart Digital Village</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#d1fae5,#bbf7d0);
}

.container{
    width:420px;
    background:#fff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 15px 35px rgba(22,163,74,.15);
    animation:fadeIn .5s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.logo{
    width:85px;
    height:85px;
    margin:auto;
    border-radius:50%;
    background:#dcfce7;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
}

h2{
    text-align:center;
    color:#166534;
    margin-top:18px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin:10px 0 30px;
    font-size:14px;
    line-height:22px;
}

.input-group{
    margin-bottom:25px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#166534;
    font-weight:600;
}

.input-group input{
    width:100%;
    padding:14px;
    border:2px solid #bbf7d0;
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:.3s;
}

.input-group input:focus{
    border-color:#16a34a;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#16a34a;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#15803d;
}

button:disabled{
    background:#86efac;
    cursor:not-allowed;
}

.loader{
    display:none;
    width:22px;
    height:22px;
    margin:18px auto;
    border:3px solid #dcfce7;
    border-top:3px solid #16a34a;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.message{
    text-align:center;
    margin-top:15px;
    color:#15803d;
    font-weight:500;
    display:none;
}

.back{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#16a34a;
    text-decoration:none;
    font-weight:600;
}

.back:hover{
    text-decoration:underline;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
🔒
</div>

<h2>Forgot Password</h2>

<p class="subtitle">
Enter your registered email address to receive a One-Time Password (OTP).
</p>

<div class="input-group">
<label>Email Address</label>
<input
type="email"
id="email"
placeholder="Enter your registered email"
required>
</div>

<button id="otpBtn" onclick="sendOTP()">
Get OTP
</button>

<div class="loader" id="loader"></div>

<div class="message" id="message"></div>

<a href="/login" class="back">
← Back to Login
</a>

</div>

<script>

async function sendOTP(){

let email=document.getElementById("email").value.trim();

if(email===""){
alert("Please enter your email.");
return;
}

document.getElementById("loader").style.display="block";
document.getElementById("otpBtn").disabled=true;

try{

const response=await fetch("/send-otp",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email:email
})

});

const data=await response.json();

document.getElementById("loader").style.display="none";
document.getElementById("otpBtn").disabled=false;

if(data.success){

// Store email for resend OTP
sessionStorage.setItem("resetEmail", email);

document.getElementById("message").style.display="block";
document.getElementById("message").innerHTML="OTP sent successfully. Redirecting...";

setTimeout(function(){

window.location.href="/verify-otp";

},1200);

}
else{

alert(data.message);

}

}
catch(error){

document.getElementById("loader").style.display="none";
document.getElementById("otpBtn").disabled=false;

alert("Unable to connect to the server.");

}

}

</script>

</body>
</html>
